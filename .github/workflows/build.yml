name: Compilar G3G3AI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y bubblewrap
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q -rs tests

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependencias
        run: pip install -r requirements.txt pyinstaller pywebview
      - name: Pruebas en Windows
        run: |
          pip install pytest
          python -m pytest -q tests
      - name: Compilar G3G3AI.exe
        run: pyinstaller --noconfirm --distpath dist packaging/g3g3ai.spec
      - name: Comprobar que el .exe arranca y responde
        shell: pwsh
        run: |
          $env:G3G3AI_CONFIG_DIR = "$env:RUNNER_TEMP\g3cfg"
          $env:G3G3AI_DATA_DIR = "$env:RUNNER_TEMP\g3data"
          $p = Start-Process -FilePath dist\G3G3AI.exe -ArgumentList "--headless","--port","8877" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8877/; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\g3data\g3g3ai.log" -ErrorAction SilentlyContinue; throw "El .exe no respondió" }
          Write-Host "El .exe arranca y sirve la interfaz"
      - uses: actions/upload-artifact@v4
        with:
          name: G3G3AI-windows
          path: dist/G3G3AI.exe

  linux:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --distpath dist packaging/g3g3ai.spec
      - run: mv dist/G3G3AI dist/G3G3AI-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: G3G3AI-linux-x64
          path: dist/G3G3AI-linux-x64

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
