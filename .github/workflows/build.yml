name: Compilar G3G3AI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y bubblewrap
      - run: pip install -r requirements.txt pytest pytest-timeout playwright
      - name: Navegador para las pruebas de interfaz
        run: |
          # El repositorio de Microsoft del runner a veces responde 403 y rompe apt-get update: no hace falta aquí
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources
          playwright install --with-deps chromium
      - run: python -m pytest -q -rs --timeout=180 tests

  windows:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependencias
        run: pip install -r requirements.txt pyinstaller pywebview
      - name: Pruebas en Windows
        run: |
          pip install pytest pytest-timeout
          python -m pytest -q --timeout=180 tests
      - name: Compilar G3G3AI.exe
        run: pyinstaller --noconfirm --distpath dist packaging/g3g3ai.spec
      - name: Comprobar que el .exe arranca y responde
        shell: pwsh
        run: |
          $env:G3G3AI_CONFIG_DIR = "$env:RUNNER_TEMP\g3cfg"
          $env:G3G3AI_DATA_DIR = "$env:RUNNER_TEMP\g3data"
          $p = Start-Process -FilePath dist\G3G3AI.exe -ArgumentList "--headless","--port","8877" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8877/; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          $ocr = $null
          if ($ok) { try { $ocr = Invoke-RestMethod -TimeoutSec 120 http://127.0.0.1:8877/api/ocr/selftest } catch { Write-Host $_ } }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\g3data\g3g3ai.log" -ErrorAction SilentlyContinue; throw "El .exe no respondió" }
          $ocr | Format-List
          if (-not $ocr.ok) { throw "El OCR no funciona dentro del .exe" }
          Write-Host "El .exe arranca y sirve la interfaz"
      - uses: actions/upload-artifact@v4
        with:
          name: G3G3AI-windows
          path: dist/G3G3AI.exe
      # Edición completa: el .exe con llama.cpp (CPU y Vulkan), stable-diffusion.cpp, Python y Git portátiles al lado
      - name: Preparar la edición completa
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          python packaging/fetch_extras.py windows dist/full/G3G3AI-extras
          copy dist\G3G3AI.exe dist\full\G3G3AI.exe
      - name: Comprobar que la edición completa encuentra lo incluido
        shell: pwsh
        run: |
          $env:G3G3AI_CONFIG_DIR = "$env:RUNNER_TEMP\g3cfg2"
          $env:G3G3AI_DATA_DIR = "$env:RUNNER_TEMP\g3data2"
          $p = Start-Process -FilePath dist\full\G3G3AI.exe -ArgumentList "--headless","--port","8878" -PassThru
          $st = $null
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $st = Invoke-RestMethod http://127.0.0.1:8878/api/status; break } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $st) { throw "La edición completa no arrancó" }
          $st.extras | Format-List
          if (-not $st.extras.llama_cpu) { throw "No encuentra el motor incluido" }
      - name: Comprimir la edición completa
        run: Compress-Archive -Path dist\full\* -DestinationPath dist\G3G3AI-windows-completo.zip
      - uses: actions/upload-artifact@v4
        with:
          name: G3G3AI-windows-completo
          path: dist/G3G3AI-windows-completo.zip

  linux:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --distpath dist packaging/g3g3ai.spec
      - run: mv dist/G3G3AI dist/G3G3AI-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: G3G3AI-linux-x64
          path: dist/G3G3AI-linux-x64
      - name: Edición completa para Linux
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          mkdir -p dist/full
          python packaging/fetch_extras.py linux dist/full/G3G3AI-extras
          cp dist/G3G3AI-linux-x64 dist/full/G3G3AI
          tar -C dist/full -czf dist/G3G3AI-linux-x64-completo.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: G3G3AI-linux-x64-completo
          path: dist/G3G3AI-linux-x64-completo.tar.gz

  macos:
    needs: tests
    runs-on: macos-latest          # Apple Silicon (arm64)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependencias
        run: pip install -r requirements.txt pyinstaller pywebview
      - name: Compilar G3G3AI.app
        run: pyinstaller --noconfirm --distpath dist packaging/g3g3ai.spec
      - name: Firmar (ad hoc) y comprobar que arranca y responde
        run: |
          codesign --force --deep --sign - dist/G3G3AI.app
          export G3G3AI_CONFIG_DIR="$RUNNER_TEMP/g3cfg" G3G3AI_DATA_DIR="$RUNNER_TEMP/g3data"
          dist/G3G3AI.app/Contents/MacOS/G3G3AI --headless --port 8879 &
          PID=$!
          ok=0
          for i in $(seq 1 60); do
            sleep 1
            if curl -sf http://127.0.0.1:8879/ >/dev/null; then ok=1; break; fi
          done
          if [ "$ok" = 1 ]; then curl -s -m 120 http://127.0.0.1:8879/api/ocr/selftest || true; echo; fi
          kill $PID 2>/dev/null || true
          if [ "$ok" != 1 ]; then cat "$RUNNER_TEMP/g3data/g3g3ai.log" 2>/dev/null || true; echo "La app no respondió"; exit 1; fi
      - name: Empaquetar
        run: ditto -c -k --keepParent dist/G3G3AI.app dist/G3G3AI-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: G3G3AI-macos
          path: dist/G3G3AI-macos.zip

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Compilar APK (firmada con clave de prueba)
        run: gradle -p android --no-daemon assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk G3G3AI-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: G3G3AI-android
          path: G3G3AI-android.apk

  release:
    # Con una etiqueta v* o al lanzar el flujo a mano (Actions → Run workflow): compila y publica la Release
    # Si macOS falla no se bloquea el resto: se publica sin esa descarga (y se ve en el registro)
    if: ${{ !cancelled() && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.android.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    needs: [windows, linux, android, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: v
        run: |
          echo "version=$(python3 -c 'import re;print(re.search(r"__version__ = \"([^\"]+)\"", open("g3g3ai/__init__.py").read()).group(1))')" >> "$GITHUB_OUTPUT"
      - name: Notas de la versión (novedades desde la versión anterior)
        run: python3 packaging/release_notes.py > notes.md && cat notes.md
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.v.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: G3G3AI ${{ steps.v.outputs.version }}
          make_latest: true
          body_path: notes.md
          files: dist/*
